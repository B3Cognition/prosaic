[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic"
version = "0.3.0"
description = "Canonical Markdown prose distribution engine"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0", "pyuca>=1.2"]
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Repository = "https://github.com/B3Cognition/prosaic"
Issues = "https://github.com/B3Cognition/prosaic/issues"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]

[project.scripts]
prosaic = "prosaic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosaic = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
