name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  windows-project-lock:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python test environment
        run: python -m pip install -e '.[test]'
      - name: Verify native Windows ownership and reserved-inode behavior
        run: >-
          python -m pytest tests/test_project_lock.py -q
          -k "mutation_entrypoints or process_death or other_projects or zero_target
          or cli_reports or all_mutators or atomic_temporary or old_manifest
          or render_descriptor"
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Node is a frozen differential-test oracle, not a runtime dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Verify Python and original CLI contracts
        run: .venv/bin/python scripts/verify_migration.py
      - name: Build Python release artifacts
        run: .venv/bin/python -m build
      - name: Verify installed wheel without Node
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/prosaic-*-py3-none-any.whl
          .wheel-test/bin/python scripts/wheel_smoke.py
      - name: Upload Python distributions and parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}
          path: |
            dist/
            parity-results/latest.json
          retention-days: 90
